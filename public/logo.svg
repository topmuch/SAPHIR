<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="gem" cx="0.5" cy="0.32" r="0.9">
      <stop offset="0%" stop-color="#8fa6d6"/>
      <stop offset="30%" stop-color="#5091ce"/>
      <stop offset="65%" stop-color="#0031b3"/>
      <stop offset="100%" stop-color="#001c83"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5091ce" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5091ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe0f5"/>
    </linearGradient>
  </defs>

  <!-- Lueur sous le diamant (comme le logo original) -->
  <ellipse cx="32" cy="54" rx="16" ry="3.2" fill="url(#glow)"/>

  <!-- Silhouette du diamant (brillant vu de face) -->
  <path d="M22 13 L42 13 L54 27 L32 53 L10 27 Z" fill="url(#gem)"/>

  <!-- Facettes : couronne -->
  <path d="M22 13 L32 21 L42 13" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M22 13 L15 27 M42 13 L49 27" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.2"/>
  <path d="M32 21 L24 27 M32 21 L40 27" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>

  <!-- Ceinture (girdle) -->
  <path d="M10 27 L54 27" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.4"/>

  <!-- Facettes : pavillon -->
  <path d="M10 27 L32 53 L54 27" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.1"/>
  <path d="M20 27 L32 53 M44 27 L32 53" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.9"/>

  <!-- Reflet lumineux (comme le brillant du logo) -->
  <path d="M22 13 L27 13 L23 19 L18 19 Z" fill="url(#sparkle)" opacity="0.85"/>
  <path d="M15 22 L19 22 L16.5 26 L13 26 Z" fill="url(#sparkle)" opacity="0.5"/>

  <!-- Étincelle 4 branches -->
  <path d="M46 10 L47.2 12.8 L49 14 L47.2 15.2 L46 18 L44.8 15.2 L43 14 L44.8 12.8 Z" fill="#ffffff" opacity="0.95"/>
</svg>
